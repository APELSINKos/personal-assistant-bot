name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      # 3.12 is Ubuntu's own Python, the server's, with its SQLite 3.45; 3.13 is uv's, with a newer SQLite.
      UV_NO_MANAGED_PYTHON: ${{ matrix.python == '3.12' }}
    steps:
      - uses: actions/checkout@v7
      # Since v8 setup-uv has no major tags, only immutable releases: name the full version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: The server's SQLite
        if: matrix.python == '3.12'
        run: uv run python -c "import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info[:2] == (3, 45)"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          BOT_TOKEN: "123456:CI-ONLY"
        run: uv run alembic upgrade head && uv run alembic check

  webapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
