[project]
name = "personal-assistant-bot"
version = "2.6.1"
description = "Personal assistant Telegram bot"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aleksandr Kovalev" }]
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "sqlalchemy[asyncio]==2.1.1",
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "icalendar==7.3.0",
    "recurring-ical-events==3.8.2",
    "fluent.runtime==0.4.0",
    "babel==2.18.0",
    "tzdata>=2026.1",
    "uvicorn==0.54.0",
    "pillow==12.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=6",
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/coursework", "_report_build", "_other_team", "_defense", "_local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["assistant"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "assistant.core.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["assistant"]
omit = ["*/assistant/bot/__main__.py", "*/assistant/api/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
