# Gives Caddy the site host name — from its own file, so Caddy never reads the bot's secrets.
# Installed by hand to /etc/systemd/system/caddy.service.d/assistant.conf.
[Service]
EnvironmentFile=/etc/caddy/assistant.env
# The package's unit never restarts Caddy: after a crash the Mini App would stay down.
Restart=on-failure
RestartSec=5
